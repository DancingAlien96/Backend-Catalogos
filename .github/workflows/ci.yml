name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Redis
        run: |
          for i in {1..15}; do
            if nc -z localhost 6379; then
              echo "Redis is up" && break
            fi
            sleep 1
          done

      - name: Run unit tests
        run: npm test

      - name: Run Redis session integration test
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:session

      - name: Build
        run: npm run build
